[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mealie-mcp-service"
version = "0.1.0"
description = "Multi-tenant-ready, per-user Mealie service with a curated MCP interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=46,<51",
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "mcp>=2.2,<3",
  "pydantic-settings>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "structlog>=25.4,<27",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
