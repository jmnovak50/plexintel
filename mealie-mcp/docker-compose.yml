services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mealie_mcp
      POSTGRES_USER: mealie_mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - mealie-mcp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealie_mcp -d mealie_mcp"]
      interval: 5s
      timeout: 3s
      retries: 10

  mealie-mcp:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mealie_mcp:${POSTGRES_PASSWORD}@postgres/mealie_mcp
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --proxy-headers"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mealie-mcp-postgres:

