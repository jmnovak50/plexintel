version: "3.8"

services:
  backend:
    build: .
    container_name: plexintel-backend
#    depends_on:
#      - db
    ports:
      - "8489:8489"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the existing application DATABASE_URL in the private .env}
      PIPELINE_LOG_PATH: /app/logs/pipeline.log
    volumes:
      - .:/app
      - ./logs:/app/logs

volumes:
  postgres_data:
